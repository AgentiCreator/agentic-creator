<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Creator Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 8px; text-align: center; }
    p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 16px; text-align: center; }
    label { font-size: 0.85rem; color: #cbd5e1; display: block; margin-bottom: 6px; }
    textarea, input[type="text"], input[type="file"] {
      width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; margin-bottom: 12px; font-size: 0.9rem;
    }
    button {
      width: 100%; padding: 14px; background: #0284c7; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .result-box { display: none; background: #0f172a; border: 1px solid #38bdf8; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .result-title { font-weight: bold; color: #38bdf8; margin-bottom: 8px; }
    .result-content { font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Agentic Creator Studio</h1>
      <p>Job alert upload karein aur viral Short script + SEO tags payein.</p>
      
      <label>1. Job Details (Text Paste Karein):</label>
      <textarea id="jobText" rows="4" placeholder="Company, Role, Salary, Location ya Notification text yahan paste karein..."></textarea>
      
      <label>2. Ya Job Poster / Image Upload Karein:</label>
      <input type="file" id="jobImage" accept="image/*">
      
      <button id="submitBtn" onclick="processJob()">Viral Content Generate Karein</button>
      
      <div id="loader" style="display:none; text-align:center; padding:15px; color:#38bdf8;">Agents kaam kar rahe hain, thoda intezar karein...</div>
      
      <div id="resultBox" class="result-box">
        <div class="result-title">Generated Result:</div>
        <div id="resultContent" class="result-content"></div>
      </div>
    </div>
  </div>

  <script>
    const N8N_URL = "https://agenticcreator.app.n8n.cloud/webhook/agentic-process";

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function processJob() {
      const text = document.getElementById('jobText').value;
      const fileInput = document.getElementById('jobImage');
      const submitBtn = document.getElementById('submitBtn');
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');

      if (!text && fileInput.files.length === 0) {
        alert("Kripya text likhein ya image select karein!");
        return;
      }

      submitBtn.disabled = true;
      loader.style.display = "block";
      resultBox.style.display = "none";

      try {
        let payload = {
          autopilot: false,
          mode: fileInput.files.length > 0 ? "image" : "text",
          text_content: text
        };

        if (fileInput.files.length > 0) {
          payload.image_base64 = await fileToBase64(fileInput.files[0]);
        }

        const response = await fetch(N8N_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        resultContent.innerText = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
        resultBox.style.display = "block";
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        loader.style.display = "none";
      }
    }
  </script>
</body>
</html>
